AWSTemplateFormatVersion: '2010-09-09'
Description: 'Menu Management Microservice - Allows merchants to create, update, and manage their menus'

Parameters:
  Environment:
    Description: Environment (dev, test, prod)
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at least two subnets in your selected VPC
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Select one or more security groups in the selected VPC
  RegionEnv:
    Description: Stack Region
    Type: String
    Default: ap-south-1
  DomainName:
    Type: String
    Description: The existing custom domain name for API Gateway
    Default: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  DbHost:
    Type: String
    Description: The database host name
  DbUser:
    Type: String
    Description: The database master username
  DbPort:
    Type: Number
    Default: 5432
    Description: The port of the database
  DbPassword:
    Type: String
    NoEcho: true # This hides the password when viewed in the console
    Description: The database master password
  BusinessUserPool:
    Description: Cognito UserPool Name
    Type: String
    Default: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  # RewaroMenuDbName:
  #   Type: String
  #   Description: The name of the menu database
    
  LambdaPackagesBucket:
    Type: String
    Description: S3 Bucket for Lambda Packages
    Default: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
  Psycopg2Layer:
    Type: String
    Description: Lambda Layer for Psycopg2
    Default: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX


Conditions:
  IsDev: !Equals [!Ref Environment, 'dev']
  IsTest: !Equals [!Ref Environment, 'test']
  IsProd: !Equals [!Ref Environment, 'prod']

Resources:


# /////////// TODO   // make it regional
  # API Gateway
  MenuAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub menu-service-${Environment}
      Description: API for menu management service
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Stage
  MenuAPIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref MenuAPIDeployment
      RestApiId: !Ref MenuAPI
      StageName: !Ref Environment

  # API Gateway Deployment
  MenuAPIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      # Categories endpoints
      - CategoriesMethod
      - CategoryMethod
      # Items endpoints
      - ItemsMethod
      - ItemMethod
      # Item Relationships endpoints
      - ItemVariationsMethod
      - ItemVariationMethod
      - ItemAddonsMethod
      - ItemAddonMethod
      # Variations endpoints
      - VariationsMethod
      - VariationMethod
      # Addons endpoints
      - AddonsMethod
      - AddonMethod
      # Menu endpoint
      - MenuMethod
      # Outlets endpoints
      - OutletsMethod
      - OutletMethod
      - OutletMenuMethod
    Properties:
      RestApiId: !Ref MenuAPI

  # Base Path Mapping for Custom Domain
  MenuAPIBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn:
      - MenuAPIStage
    Properties:
      BasePath: menu-service
      DomainName: !Ref DomainName
      RestApiId: !Ref MenuAPI
      Stage: !Ref Environment

  # Lambda Functions
  MenuLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub menu-service-${Environment}
      Handler: app.lambda_handler
      Runtime: python3.9
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt MenuServiceLambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds: !Ref SecurityGroupIds
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          # DB_NAME: !Ref RewaroMenuDbName
          DB_USERNAME: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          ENVIRONMENT: !Ref Environment
          REGION: !Ref RegionEnv
      Layers:
        - !Ref Psycopg2Layer
      Code:
        S3Bucket: !Ref LambdaPackagesBucket
        S3Key: !Sub menu-service-${Environment}.zip


#/////////////// TODO // need more permissions and remove rds policy
  # Lambda Execution Role
  MenuServiceLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: menu-service-lambda-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DashboardGetReviewsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LambdaAccessResources
                Effect: Allow
                Action:
                  - dynamodb:*
                  - cloudwatch:*
                  - s3:*
                  - cognito-idp:AdminGetUser
                  - cognito-idp:ListUsers
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:HeadObject
                Resource: "*"

        - PolicyName: APIGatewayFullAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: VisualEditor0
                Effect: Allow
                Action: apigateway:*
                Resource: "*"
        - PolicyName: InvokePermissionAPIGateway
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: "*"
        - PolicyName: VPCAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"


  # Add Cognito Authorizer
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoUserPoolAuthorizer
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref MenuAPI
      ProviderARNs:
        - !Ref BusinessUserPool

  # API Gateway Resource and Method for Categories
  CategoriesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MenuAPI
      ParentId: !GetAtt MenuAPI.RootResourceId
      PathPart: 'categories'

  CategoriesMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MenuAPI
      ResourceId: !Ref CategoriesResource
      HttpMethod: ANY
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MenuLambdaFunction.Arn}/invocations

  CategoryResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MenuAPI
      ParentId: !Ref CategoriesResource
